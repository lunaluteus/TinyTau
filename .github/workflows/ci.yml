name: TinyTau CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  human-check:
    name: Human Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compare roadmap/ human files against upstream
        run: bash .tinytau/scripts/compare-human.sh

  build:
    name: Build
    if: github.event_name == 'pull_request'
    needs: human-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - &strict-lean-build
        uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          axiom-audit: "true"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"

  build-and-publish:
    name: Build and Publish
    if: github.event_name == 'push'
    needs: human-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v5
      - *strict-lean-build

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render roadmap and copy site pages
        run: |
          bash .tinytau/scripts/build-roadmap.sh
          cp -r .tinytau/page/. _site/

      - name: Build API documentation
        uses: leanprover-community/docgen-action@main
        with:
          homepage: _site
          build-page: false
          api-docs: true
          use-github-cache: true
          deploy: false

      - name: Rewrite roadmap links in API documentation
        run: python3 .tinytau/scripts/rewrite-doc-links.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  add-tag:
    name: Add Tag
    needs: build-and-publish
    if: github.event_name == 'push' && !github.event.created
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Tag Lean toolchain updates
        uses: leanprover-community/lean-release-tag@v1
        continue-on-error: true
        with:
          do-release: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
